name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes make python3 shellcheck git
      - name: Check scripts
        run: make check
